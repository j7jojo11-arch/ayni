<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>عيني | AYNi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#06122B">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06122B;--bg2:#0B1F4B;--card:#0E2A5E;--line:#2A4C93;--sky:#45C9FF;--ice:#CFEAFF;--w:#fff;--fs:1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#030B1C}
:root[data-hc="1"]{--bg:#000;--bg2:#000;--card:#000;--line:#fff;--sky:#7FE3FF}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#030B1C;color:var(--w);font-family:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;font-size:calc(18px*var(--fs));line-height:1.7}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% 18%,#123A86 0,var(--bg) 62%);position:relative;overflow:hidden}
:root[data-hc="1"] #app{background:#000}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px}
.top h1{margin:0;font-size:1.15em;flex:1}
.top h1 small{display:block;font-size:.65em;font-weight:400;color:var(--ice)}
.ib{width:52px;height:52px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ic{width:26px;height:26px}
main{flex:1;overflow:auto;padding:8px 18px 24px}
nav{display:flex;background:#050E24;border-top:1px solid var(--line)}
:root[data-hc="1"] nav{background:#000}
nav button{flex:1;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78em;color:var(--ice)}
nav button[aria-current="page"]{color:var(--sky);font-weight:700;background:var(--card);border-radius:18px;margin:6px 8px;min-height:56px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:84px;border-radius:26px;font-weight:700;font-size:1.2em;margin-top:14px}
.btn.p{background:linear-gradient(135deg,#45C9FF,#1E86E8);color:#04142F;box-shadow:0 0 34px #45C9FF66}
.btn.s{background:var(--bg2);border:2px solid var(--sky);color:var(--w)}
.sm{min-height:56px;font-size:1em;border-radius:18px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-top:12px}
.card h3{margin:0 0 4px;font-size:.95em;color:var(--sky)}
.card p{margin:0}
.c{text-align:center}
.note{background:#1B3A7A;border:1px dashed var(--sky);border-radius:16px;padding:10px 14px;font-size:.85em;margin-top:12px}
.orbw{display:grid;place-items:center;margin:6px 0}
.orb{width:min(58vw,230px);aspect-ratio:1;position:relative;border-radius:50%;animation:br 5s ease-in-out infinite;filter:drop-shadow(0 0 28px #45C9FF99)}
.orb.mini{width:104px}
.orb svg{width:100%;height:100%;display:block}
.pup{animation:look 7s ease-in-out infinite;transform-origin:100px 100px}
.orb.listen::before,.orb.listen::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--sky);animation:rip 1.8s ease-out infinite}
.orb.listen::after{animation-delay:.9s}
.orb.speak{animation:sp .55s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.035)}}
@keyframes look{20%{transform:translate(7px,-3px)}50%{transform:translate(-6px,4px)}80%{transform:translate(3px,5px)}}
@keyframes rip{from{transform:scale(1);opacity:.9}to{transform:scale(1.45);opacity:0}}
@keyframes sp{50%{transform:scale(1.07)}}
.wave{display:flex;gap:5px;justify-content:center;height:34px;align-items:center}
.wave i{width:6px;height:8px;border-radius:3px;background:var(--sky);opacity:.35}
.listen~.wave i,.wave.on i{opacity:1;animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.2s!important}.wave i:nth-child(3n){animation-delay:.4s!important}
@keyframes wv{50%{height:30px}}
.msgs{display:flex;flex-direction:column;gap:10px;min-height:120px}
.m{max-width:88%;padding:12px 16px;border-radius:20px}
.m.u{align-self:flex-start;background:var(--sky);color:#04142F}
.m.a{align-self:flex-end;background:var(--card);border:1px solid var(--line)}
.row{display:flex;gap:10px}
.row>*{flex:1}
input[type=text],input[type=time],input[type=search]{width:100%;min-height:56px;border-radius:16px;border:2px solid var(--line);background:#071A40;padding:0 14px;margin-top:8px}
:root[data-hc="1"] input{background:#000}
.cam{position:relative;border-radius:26px;overflow:hidden;background:#000;aspect-ratio:3/4;border:2px solid var(--sky)}
.cam video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:12% 10%;border:3px solid var(--sky);border-radius:22px;box-shadow:0 0 30px #45C9FF88,0 0 0 999px #0008}
.ln{position:absolute;left:10%;right:10%;height:3px;background:var(--sky);box-shadow:0 0 14px var(--sky);animation:sc 2.4s ease-in-out infinite}
@keyframes sc{0%,100%{top:14%}50%{top:84%}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;width:100%;text-align:right}
.tg{width:62px;height:34px;border-radius:17px;background:#2A4C93;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
[aria-checked=true] .tg{background:var(--sky)}
[aria-checked=true] .tg::after{right:32px}
.st{font-size:.8em;color:var(--ice)}
.thumb{width:86px;height:86px;border-radius:18px;background:#071A40;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.hd{display:flex;gap:14px;align-items:center}
#toast{position:absolute;bottom:90px;left:16px;right:16px;background:var(--sky);color:#04142F;border-radius:18px;padding:14px 16px;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:.25s;transform:translateY(10px)}
#toast.on{opacity:1;transform:none}
#al{position:absolute;inset:0;background:#030B1Cee;display:none;flex-direction:column;justify-content:center;padding:24px;z-index:9}
#al.on{display:flex}
#sp{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:repeating-linear-gradient(90deg,#041030 0 14%,#071A47 14% 22%,#041030 22% 78%,#071A47 78% 86%,#041030 86% 100%);transition:opacity .8s}
#sp.off{opacity:0;pointer-events:none}
#sp h1{margin:18px 0 4px;font-size:2em}#sp p{margin:0;color:var(--sky)}
.btn.ice{background:linear-gradient(135deg,#fff,#CFE6FF);color:#06224F;box-shadow:0 0 28px #CFE6FF55}
.btn.warm{background:linear-gradient(135deg,#FF9A62,#FF4FA3 55%,#8B5CF6);color:#fff;box-shadow:0 0 28px #FF4FA355}
.em{font-size:1.35em}.ne{font-size:1.5em;line-height:1}
.chip{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:.85em}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}
.chp{flex:none;min-height:52px;padding:0 18px;border-radius:20px;border:2px solid var(--c);background:var(--bg2);font-weight:700}
.chp[aria-pressed=true]{background:var(--c);color:#04142F}
.mc{border-inline-start:8px solid var(--c)}
.wr{margin-top:12px;border:2px solid #F5D76E;border-radius:16px;padding:12px 14px;background:#232A3E;color:#FFF3C4;font-size:.85em}
.pop{animation:pp .5s}
@keyframes pp{0%{transform:scale(.9)}60%{transform:scale(1.04)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.h2{font-size:1.1em;margin:18px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

 if(!shots.length){stat('لم تُلتقط أي صورة. وجّه الكاميرا نحو العلبة ثم أعد المحاولة، أو اختر صورة من المعرض.');speak('لم تُلتقط أي صورة.');return}
 if(!window.Tesseract){stat('تعذّر تحميل أداة قراءة النص. تحقق من الإنترنت ثم أعد فتح الصفحة.');speak('تعذّر تحميل أداة قراءة النص.');return}

  const best=shots[0];

  if(confOf(found)!=='high'&&!found.length)await tryC(prep(best,'gray'));

}

function render(pre){
 const v=S.view,m={confirm:vConfirm,lib:vLib,home:vHome,common:vCommon,ocr:vOcr,chat:vChat,scan:vScan,result:vResult,meds:vMeds,rem:()=>vRem(pre),set:vSet}[v]();
 $('#app').innerHTML=m+(tab(v)?nav():'')+'<div id="toast" role="status" aria-live="polite"></div><div id="al" role="alertdialog" aria-label="تذكير دواء"></div>';
 setOrb(orbSt);const h=$('#h1');h&&h.focus({preventScroll:true});
 if(v==='scan')startScan();
 const ls=$('#ls');ls&&ls.addEventListener('input',e=>{S.lq=e.target.value;$('#ll').innerHTML=libList(S.lq)});
 const hs=$('#hs');hs&&hs.addEventListener('input',e=>{$('#hl').innerHTML=histList(e.target.value)});
 const q=$('#q');q&&q.addEventListener('keydown',e=>{if(e.key==='Enter')act('ask')});
 const fi=$('#fi');fi&&fi.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const w=Math.min(1600,im.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(w*im.height/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.shots=[{c,sharp:1}];S.raw=[];S.bc=null;S.img=thumb(c);finishScan()};im.src=URL.createObjectURL(f)});
 const rt=$('#rate');rt&&rt.addEventListener('input',e=>{S.set.rate=+e.target.value;save()});
 const vo=$('#vol');vo&&vo.addEventListener('input',e=>{S.set.vol=+e.target.value;save()});
 if(rt)rt.addEventListener('change',()=>speak('هذه سرعة القراءة الحالية.'));
}
let prev='home';
function go(v){if(S.view==='scan'&&v!=='scan')stopCam();if(S.view==='chat'){S.conv=false;rec&&rec.abort();speechSynthesis&&speechSynthesis.cancel();setOrb('')}if(v!==S.view&&S.view!=='scan'&&S.view!=='result'&&S.view!=='ocr'&&S.view!=='chat'&&S.view!=='lib'&&S.view!=='confirm')prev=S.view;if(v==='result'&&S.view==='lib')S.fromLib=1;else if(v!=='result')S.fromLib=0;S.view=v;render();window.scrollTo(0,0)}

function act(a,d={}){const d0=d;
 const id=+d.id,M=S.meds.find(x=>x.id===id),H=S.hist.find(x=>x.id===id),R=S.rem.find(x=>x.id===id);
 switch(a){
  case 'go':go(d.v);break;
  case 'pw':clip('intro');st.set('ayni_intro',1);break;
  case 'pw2':clip('hello');break;
  case 'back':go(S.view==='result'&&S.fromLib?'lib':(prev||'home'));break;
  case 'lopen':{const d=byId(d0.id);S.ctx=toCtx(d);S.img=null;go('result');speak(d.ar+'. يستخدم في: '+d.use);break}
  case 'voice':S.set.voice=!S.set.voice;if(!S.set.voice)speechSynthesis&&speechSynthesis.cancel();save();render();break;
  case 'tg':S.set[d.k]=!S.set[d.k];save();applySet();render();if(d.k==='blind'&&S.set.blind)speak('تم تشغيل وضع المكفوفين.');break;
  case 'fs':S.set.fs=+d.v;save();applySet();render();break;
  case 'mic':S.conv=true;speechSynthesis&&speechSynthesis.cancel();listen();break;
  case 'stopl':S.conv=false;rec&&rec.abort();speechSynthesis&&speechSynthesis.cancel();setOrb('');stat('تم الإيقاف.');break;
  case 'replay':S.last?speak(S.last):toast('لا توجد إجابة لإعادتها.');break;
  case 'ask':{const q=$('#q');if(q&&q.value.trim()){const t=q.value;q.value='';handle(t)}break}
  case 'finish':finishScan();break;
  case 'cyes':confirmYes();break;
  case 'cno':confirmNo();break;
  case 'cother':confirmOther();break;
  case 'cq':speak(confirmQ());break;
  case 'spell':speak('الكلمة المقروءة حرفًا حرفًا: '+String(S.readWord||'').toUpperCase().split('').join('، '));break;
  case 'cpick':S.ci=+d0.i;S.conf='low';S.readWord='';S.risk=null;go('confirm');speak(confirmQ());break;
  case 'read':readMed();break;
  case 'addmed':{const m=S.ctx||D;if(S.meds.some(x=>x.name===m.name)){toast('هذا الدواء موجود في أدويتك.',true);break}S.meds.unshift({...m,id:Date.now(),added:new Date().toLocaleDateString('ar'),img:S.img||(S.hist[0]&&S.hist[0].img)||null});save();buzz();toast('تمت إضافة الدواء إلى أدويتك.',true);break}
  case 'remfor':{S.view='rem';render({name:(S.ctx||D).name,dose:''});break}
  case 'open':S.ctx=M;S.img=M.img;prev='meds';go('result');break;
  case 'hopen':if(H.drug){S.ctx=toCtx(byId(H.drug),H.str,H.exp);S.img=H.img;S.cands=[];go('result');break}if(H.ocr){S.ocr=H.ocr;S.img=H.img;go('ocr');break}S.ctx=D;S.img=H.img;go('result');break;
  case 'hread':if(H.drug){S.ctx=toCtx(byId(H.drug),H.str,H.exp);readMed();break}if(H.ocr){speak(ocrSpeak(H.ocr));break}S.ctx=D;readMed();break;
  case 'hdel':S.hist=S.hist.filter(x=>x.id!==id);save();$('#hl').innerHTML=histList($('#hs').value);toast('تم حذف السجل.');break;
  case 'radd':addRem();break;
  case 'rdel':S.rem=S.rem.filter(x=>x.id!==id);save();render();break;
  case 'rtake':R.taken=new Date().toDateString();save();render();toast('تم تسجيل أنك تناولت '+R.name,true);break;
  case 'taken':R.taken=new Date().toDateString();save();$('#al').classList.remove('on');speechSynthesis.cancel();toast('تم تسجيل تناول الدواء.');if(S.view==='rem')render();break;
  case 'snooze':{const d2=new Date(Date.now()+600000);R.time=String(d2.getHours()).padStart(2,'0')+':'+String(d2.getMinutes()).padStart(2,'0');save();$('#al').classList.remove('on');speechSynthesis.cancel();toast('تم التأجيل إلى '+R.time,true);break}
  case 'hear':speak('تعليمات '+R.name+': اتبع الجرعة المكتوبة في وصفتك. '+(R.dose||'لم تُسجَّل جرعة لهذا التذكير.'));break;
  case 'oread':speak(ocrSpeak(S.ocr));break;
  case 'pick':$('#fi').click();break;
  case 'cf':{S.cf=d.k;$('#cc').innerHTML=cmChips();$('#cl').innerHTML=cmList();const b=$('#cc [data-k="'+d.k+'"]');b&&b.focus();break}
  case 'cmread':{const c=COMMON[+d.i];speak(c.n+'. '+c.d+' لا يناسب أو انتبه إذا: '+c.w);break}
  case 'cread':{const c=COMMON[+d.i];speak(c[0].replace(/[^\u0600-\u06FF\s]/g,'')+'. '+c[1]+' '+c[2]);break}
  case 'wipe':if(confirm('حذف كل الأدوية والسجل والتذكيرات؟')){S.meds=[];S.hist=[];S.rem=[];S.ctx=null;save();render();toast('تم حذف بياناتك.',true)}break;
 }
}
