.st{font-size:.8em;color:var(--ice)}

const STOP=new Set(['tablet','tablets','tabs','capsule','capsules','cream','ointment','oral','gel','paste','forte','plus','extra','advance','acid','sodium','film','coated','syrup','suspension','injection','dental','mouthwash','cool','mint','sulfate','caffeine','tablette','tabletten','وصفة','اقراص','أقراص','كبسول','كريم','شراب','حقن','جل','دواء']);
const nz=s=>String(s).toLowerCase().replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ًٌٍَُِّْـ]/g,'').replace(/[^a-zء-ي0-9]+/g,' ').trim();
function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const c=[i];let mn=i;for(let j=1;j<=b.length;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));if(c[j]<mn)mn=c[j]}if(mn>max)return max+1;p=c}return p[b.length]}
const TERMS=DB.map(d=>{const all=[d.en,d.ar,...d.brands,...d.aliases];const toks=new Set();all.forEach(t=>nz(t).split(' ').forEach(w=>{if(w.length>=4&&!STOP.has(w)&&!/^\d+$/.test(w))toks.add(w)}));return [...toks]});

 const res=[];
 DB.forEach((d,i)=>{let sc=0;for(const t of TERMS[i]){let best=0;for(const w of words){if(w===t){best=t.length*2;break}if(t.length>=5&&w.length>=5){const m=t.length>=8?2:1;if((w.includes(t)||t.includes(w))&&Math.min(w.length,t.length)>=5)best=Math.max(best,Math.min(w.length,t.length)*1.5);else if(lev(w,t,m)<=m)best=Math.max(best,t.length)}}sc+=best}if(sc>=8)res.push([sc,d])});

const SEC=[['الاستخدامات','uses'],['التركيز والشكل',m=>[m.strength,m.form].filter(Boolean).join(' - ')],['المادة الفعالة والأسماء التجارية','active'],['طريقة الاستخدام','how'],['الجرعة','dose'],['التحذيرات وموانع الاستخدام','warns'],['الآثار الجانبية','side'],['الحمل والرضاعة','preg'],['موانع الاستخدام','contra'],['طريقة التخزين','store'],['تاريخ انتهاء الصلاحية','exp'],['مصدر المعلومات','src']];

function answer(q){
 const fd=findDrugs(q,1);if(fd.length){S.ctx=toCtx(fd[0]);}
 if(!S.ctx)return 'لم أتعرف على دواء بعد. صوّر الدواء أو اذكر اسمه في سؤالك، مثل: ما جرعة الأموكسيسيلين؟';
 if(fd.length&&!QA.some(([re])=>re.test(q)))return 'هذا '+S.ctx.name+'. يستخدم في: '+S.ctx.uses+' الجرعة: '+S.ctx.dose;
 for(const [re,f] of QA)if(re.test(q))return f(S.ctx);
 return 'لا تتوفر لدي معلومة موثوقة تجيب عن هذا السؤال عن '+S.ctx.name+'. يمكنك أن تسأل عن الاستخدام أو الجرعة أو التحذيرات أو الآثار الجانبية أو الحمل. أو اسأل الصيدلي.';
}

/* ---------- voice ---------- */
let rec=null,orbSt='';
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function setOrb(s){orbSt=s;document.querySelectorAll('.orb').forEach(o=>{o.classList.toggle('listen',s==='listen');o.classList.toggle('speak',s==='speak')});document.querySelectorAll('.wave').forEach(w=>w.classList.toggle('on',s==='listen'||s==='speak'))}
function speak(t,cb){
 S.last=t;
 if(!S.set.voice||!('speechSynthesis' in window)){cb&&setTimeout(cb,400);return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=S.set.rate;u.volume=S.set.vol;
 u.onstart=()=>setOrb('speak');u.onend=u.onerror=()=>{setOrb('');cb&&cb()};
 speechSynthesis.speak(u);
}
function buzz(){if(S.set.vib&&navigator.vibrate)navigator.vibrate(80)}
function toast(t,say){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600);if(say)speak(t)}
function listen(){
 if(!SR){toast('هذا المتصفح لا يدعم التعرف على الصوت. اكتب سؤالك.');const q=$('#q');q&&q.focus();return}
 try{rec&&rec.abort();rec=new SR();rec.lang='ar-SA';rec.interimResults=false;
  rec.onstart=()=>{setOrb('listen');stat('أستمع إليك...')};
  rec.onresult=e=>handle(e.results[0][0].transcript);
  rec.onerror=()=>{setOrb('');S.conv=false;stat('تعذّر الاستماع. تأكد من إذن الميكروفون ثم اضغط الميكروفون.')};
  rec.onend=()=>{if(orbSt==='listen')setOrb('')};
  rec.start();}catch(e){stat('تعذّر تشغيل الميكروفون.')}
}
function stat(t){const e=$('#stat');if(e)e.textContent=t}

/* ---------- chat ---------- */
function addMsg(t,who){const b=$('#msgs');if(!b)return;const d=document.createElement('div');d.className='m '+who;d.textContent=t;b.appendChild(d);d.scrollIntoView({block:'end'})}
function handle(text){
 const t=text.trim();if(!t)return;addMsg(t,'u');
 const cmd=[[/(افتح|شغل).*(كاميرا)|صور/,()=>go('scan'),'أفتح الكاميرا.'],[/(دليل|قائمة).*(أدوية|ادوية)/,()=>go('lib'),'هذا دليل الأدوية.'],[/(أدويتي|ادويتي)/,()=>go('meds'),'هذه أدويتك.'],[/(مواعيد|تذكير)/,()=>{go('rem');speak(todayText())},null],[/اقرأ.*معلومات/,()=>readMed(),null]];
 for(const [re,fn,say] of cmd)if(re.test(t)){S.conv=false;if(say)speak(say);fn();return}
 const a=answer(t);addMsg(a,'a');speak(a,()=>{if(S.conv&&S.view==='chat')listen()});
}
function todayText(){const l=[...S.rem].sort((a,b)=>a.time.localeCompare(b.time));return l.length?'مواعيد أدويتك اليوم: '+l.map(r=>r.name+' الساعة '+r.time).join('، '):'لا توجد مواعيد مسجلة اليوم.'}
function readMed(){if(!S.ctx){speak('لم أتعرف على دواء بعد.');return}speak(S.ctx.name+'. '+secs(S.ctx).map(([l,k])=>l+': '+val(S.ctx,k)).join('. '))}

/* ---------- camera / scan ---------- */
let stream=null,timer=null,frames=0,bd=null;
async function startScan(){
 frames=0;S.img=null;S.shots=[];const v=$('#vid');
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  v.srcObject=stream;await v.play();
  stat('وجّه الكاميرا نحو علبة الدواء. أصوّر كل ثانيتين.');speak('وجّه الكاميرا نحو علبة الدواء وثبّتها.');
  if('BarcodeDetector' in window){try{bd=new BarcodeDetector()}catch(e){bd=null}}
  timer=setInterval(grab,2000);
 }catch(e){stat('تعذّر فتح الكاميرا. اسمح بالوصول إلى الكاميرا من إعدادات المتصفح، أو تابع بالبيانات التجريبية.');speak('تعذّر فتح الكاميرا.')}
}
const thumb=c=>{const t=document.createElement('canvas');t.width=240;t.height=Math.round(240*c.height/c.width);t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.6)};
async function grab(){
 const v=$('#vid');if(!v||!v.videoWidth)return;
 const w=Math.min(1280,v.videoWidth),c=document.createElement('canvas'),x=c.getContext('2d');c.width=w;c.height=Math.round(w*v.videoHeight/v.videoWidth);
 x.filter='grayscale(1) contrast(1.4)';x.drawImage(v,0,0,c.width,c.height);
 S.shots.push(c);if(S.shots.length>5)S.shots.shift();S.img=thumb(c);frames++;
 stat('تم التقاط '+frames+' صورة. استمر في تحريك العلبة ببطء.');
 if(bd){try{const r=await bd.detect(v);if(r.length){stat('تم رصد باركود: '+r[0].rawValue+'. لم يتم التحقق منه لأنه لا توجد قاعدة بيانات مرتبطة.');buzz()}}catch(e){}}
}
function stopCam(){clearInterval(timer);timer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
const AR='٠١٢٣٤٥٦٧٨٩';
function parseMed(raw){
 const t=raw.replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[ \t]+/g,' ');
 const lines=t.split(/\n+/).map(x=>x.trim()).filter(x=>x.length>5);
 const pick=(re,ex)=>[...new Set(lines.filter(l=>re.test(l)&&(!ex||ex.test(l))).map(l=>l.slice(0,180)))].slice(0,3);
 const dose=pick(/(جرع|dose|dosage|يؤخذ|تؤخذ|يُؤخذ|مرات|مرة|مرتين|كل \d|ساعات|يومي|daily|times|every|hours|twice|once|take )/i,/(\d|مرة|مرتين|ثلاث|once|twice|daily|يومي)/i);
 const reason=pick(/(يستخدم|يُستخدم|دواعي|استطباب|لعلاج|لتخفيف|لتسكين|لخفض|مسكن|خافض|مضاد|indicat|used (for|to)|relief|treatment of|for the)/i);
 const str=[...new Set((t.match(/\d+(?:[.,]\d+)?\s?(?:mg|mcg|µg|ml|g)(?![a-z])|\d+(?:[.,]\d+)?\s?(?:ملغ|ملجم|مجم|مل|جم)/gi)||[]).map(x=>x.trim()))].slice(0,3);
 return {dose,reason,str};
}
const ocrSpeak=o=>'سبب الاستخدام: '+(o.reason.length?o.reason.join('. '):'لم أجده مكتوبًا على الأجزاء المصورة')+'. الجرعة: '+(o.dose.length?o.dose.join('. '):'لم أجد تعليمات الجرعة مكتوبة، ولا تخمّن الجرعة')+'. هذه قراءة آلية قد تخطئ، فتأكد من الصيدلي أو الطبيب.';
async function finishScan(){
 stopCam();const shots=(S.shots||[]).slice(-3);

<button class="btn s sm" data-a="replay">${ic('re')} أعد قراءة المعلومات</button>
<button class="btn s sm" data-a="go" data-v="chat">${ic('mic')} اسأل عيني عن هذا الدواء</button>
<button class="btn s sm" data-a="addmed">${ic('pill')} أضف الدواء إلى أدويتي</button>
<button class="btn s sm" data-a="remfor">${ic('bell')} أضف موعدًا للتذكير</button>
<button class="btn s sm" data-a="go" data-v="scan">${ic('cam')} صوّر جهة أخرى من العبوة</button></main>`}

function vMeds(){return top('أدويتي')+`<main>${S.meds.length?S.meds.map(m=>`<button class="card hd" style="width:100%;text-align:right" data-a="open" data-id="${m.id}"><div class="thumb">${m.img?`<img src="${m.img}" alt="">`:ic('pill')}</div><div><b>${esc(m.name)}</b><div>${esc(m.strength)}</div><div class="st">أضيف في ${esc(m.added)}${S.rem.some(r=>r.name===m.name)?' - له تذكير':''}</div></div></button>`).join(''):'<p class="card c">لم تضف أدوية بعد. اضغط «تعرّف على دوائك» ثم «أضف الدواء إلى أدويتي».</p>'}
<h2 class="h2">سجل التعرف</h2><input type="search" id="hs" placeholder="ابحث عن دواء بالاسم" aria-label="ابحث في السجل"><div id="hl">${histList('')}</div></main>`}
function histList(q){const l=S.hist.filter(h=>h.name.includes(q));return l.length?l.map(h=>`<div class="card"><b>${esc(h.name)}</b><div class="st">${esc(h.date)}</div><div class="row"><button class="btn s sm" data-a="hopen" data-id="${h.id}">فتح</button><button class="btn s sm" data-a="hread" data-id="${h.id}">استمع</button><button class="btn s sm" data-a="hdel" data-id="${h.id}">حذف</button></div></div>`).join(''):'<p class="card c">لا توجد نتائج في السجل.</p>'}

function vRem(pre){return top('التذكيرات')+`<main>${S.rem.length?[...S.rem].sort((a,b)=>a.time.localeCompare(b.time)).map(r=>{const t=r.taken===new Date().toDateString();return `<div class="card"><div class="hd"><b style="font-size:1.6em">${r.time}</b><div style="flex:1"><b>${esc(r.name)}</b><div class="st">${esc(r.dose)}</div></div></div><div>${t?'تم تناوله اليوم ✓':'لم يُؤكَّد اليوم'}</div><div class="row"><button class="btn s sm" data-a="rtake" data-id="${r.id}">تناولته</button><button class="btn s sm" data-a="rdel" data-id="${r.id}">حذف</button></div></div>`}).join(''):'<p class="card c">لا توجد تذكيرات. أضف أول موعد من النموذج أدناه.</p>'}
<h2 class="h2">إضافة تذكير</h2><input type="text" id="rn" placeholder="اسم الدواء" aria-label="اسم الدواء" value="${esc(pre?pre.name:'')}"><input type="text" id="rd" placeholder="الجرعة كما في الوصفة" aria-label="الجرعة" value="${esc(pre?pre.dose:'')}"><input type="time" id="rt" aria-label="وقت التذكير">
<button class="btn p sm" data-a="radd">${ic('ok')} تأكيد وحفظ التذكير</button>
<p class="note">يعمل التنبيه الصوتي والاهتزاز بينما التطبيق مفتوح. الإشعارات في الخلفية تحتاج تطبيقًا مثبتًا على الجهاز، ولم تُربط بعد. تأكد من الجرعة والموعد مع وصفتك أو الصيدلي.</p></main>`}

function sw(k,l){return `<button class="card sw" role="switch" aria-checked="${S.set[k]}" data-a="tg" data-k="${k}"><span>${l}</span><span class="tg"></span></button>`}
function vSet(){return top('الإعدادات')+`<main>${sw('voice','المساعدة الصوتية')}${sw('blind','وضع المكفوفين (ترحيب صوتي وقراءة تلقائية)')}${sw('hc','التباين العالي')}${sw('vib','الاهتزازات')}
<div class="card"><label for="rate">سرعة القراءة</label><input id="rate" type="range" min=".6" max="1.5" step=".1" value="${S.set.rate}" style="width:100%;min-height:44px"></div>
<div class="card"><label for="vol">مستوى الصوت</label><input id="vol" type="range" min=".2" max="1" step=".1" value="${S.set.vol}" style="width:100%;min-height:44px"></div>
<div class="card"><div>حجم الخط</div><div class="row">${[[1,'عادي'],[1.2,'كبير'],[1.4,'ضخم']].map(([v,l])=>`<button class="btn s sm" data-a="fs" data-v="${v}" ${S.set.fs==v?'aria-pressed="true" style="background:var(--sky);color:#04142F"':'aria-pressed="false"'}>${l}</button>`).join('')}</div></div>
<div class="card"><h3>الأذونات واللغة</h3><p>اللغة: العربية. أذونات الكاميرا والميكروفون يديرها المتصفح من إعدادات الموقع.</p></div>
<div class="card"><h3>الخصوصية</h3><p>تُحفظ أدويتك وسجلك وتذكيراتك على جهازك فقط. لا تُرسل الصور إلى أي جهة.</p><button class="btn s sm" data-a="wipe">${ic('x')} حذف كل بياناتي</button></div></main>`}

function render(pre){
 const v=S.view,m={lib:vLib,home:vHome,common:vCommon,ocr:vOcr,chat:vChat,scan:vScan,result:vResult,meds:vMeds,rem:()=>vRem(pre),set:vSet}[v]();
 $('#app').innerHTML=m+(tab(v)?nav():'')+'<div id="toast" role="status" aria-live="polite"></div><div id="al" role="alertdialog" aria-label="تذكير دواء"></div>';
 setOrb(orbSt);const h=$('#h1');h&&h.focus({preventScroll:true});
 if(v==='scan')startScan();
 const ls=$('#ls');ls&&ls.addEventListener('input',e=>{S.lq=e.target.value;$('#ll').innerHTML=libList(S.lq)});
 const hs=$('#hs');hs&&hs.addEventListener('input',e=>{$('#hl').innerHTML=histList(e.target.value)});
 const q=$('#q');q&&q.addEventListener('keydown',e=>{if(e.key==='Enter')act('ask')});
 const fi=$('#fi');fi&&fi.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const w=Math.min(1600,im.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(w*im.height/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.shots=[c];S.img=thumb(c);finishScan()};im.src=URL.createObjectURL(f)});
 const rt=$('#rate');rt&&rt.addEventListener('input',e=>{S.set.rate=+e.target.value;save()});
 const vo=$('#vol');vo&&vo.addEventListener('input',e=>{S.set.vol=+e.target.value;save()});
 if(rt)rt.addEventListener('change',()=>speak('هذه سرعة القراءة الحالية.'));
}
let prev='home';
function go(v){if(S.view==='scan'&&v!=='scan')stopCam();if(S.view==='chat'){S.conv=false;rec&&rec.abort();speechSynthesis&&speechSynthesis.cancel();setOrb('')}if(v!==S.view&&S.view!=='scan'&&S.view!=='result'&&S.view!=='ocr'&&S.view!=='chat'&&S.view!=='lib')prev=S.view;if(v==='result'&&S.view==='lib')S.fromLib=1;else if(v!=='result')S.fromLib=0;S.view=v;render();window.scrollTo(0,0)}

function act(a,d={}){const d0=d;
 const id=+d.id,M=S.meds.find(x=>x.id===id),H=S.hist.find(x=>x.id===id),R=S.rem.find(x=>x.id===id);
 switch(a){
  case 'go':go(d.v);break;
  case 'back':go(S.view==='result'&&S.fromLib?'lib':(prev||'home'));break;
  case 'lopen':{const d=byId(d0.id);S.ctx=toCtx(d);S.img=null;go('result');speak(d.ar+'. يستخدم في: '+d.use);break}
  case 'voice':S.set.voice=!S.set.voice;if(!S.set.voice)speechSynthesis&&speechSynthesis.cancel();save();render();break;
  case 'tg':S.set[d.k]=!S.set[d.k];save();applySet();render();if(d.k==='blind'&&S.set.blind)speak('تم تشغيل وضع المكفوفين.');break;
  case 'fs':S.set.fs=+d.v;save();applySet();render();break;
  case 'mic':S.conv=true;speechSynthesis&&speechSynthesis.cancel();listen();break;
  case 'stopl':S.conv=false;rec&&rec.abort();speechSynthesis&&speechSynthesis.cancel();setOrb('');stat('تم الإيقاف.');break;
  case 'replay':S.last?speak(S.last):toast('لا توجد إجابة لإعادتها.');break;
  case 'ask':{const q=$('#q');if(q&&q.value.trim()){const t=q.value;q.value='';handle(t)}break}
  case 'finish':finishScan();break;
  case 'read':readMed();break;
  case 'addmed':{const m=S.ctx||D;if(S.meds.some(x=>x.name===m.name)){toast('هذا الدواء موجود في أدويتك.',true);break}S.meds.unshift({...m,id:Date.now(),added:new Date().toLocaleDateString('ar'),img:S.img||(S.hist[0]&&S.hist[0].img)||null});save();buzz();toast('تمت إضافة الدواء إلى أدويتك.',true);break}
  case 'remfor':{S.view='rem';render({name:(S.ctx||D).name,dose:''});break}
  case 'open':S.ctx=M;S.img=M.img;prev='meds';go('result');break;
  case 'hopen':if(H.drug){S.ctx=toCtx(byId(H.drug),H.str);S.img=H.img;S.cands=[];go('result');break}if(H.ocr){S.ocr=H.ocr;S.img=H.img;go('ocr');break}S.ctx=D;S.img=H.img;go('result');break;
  case 'hread':if(H.drug){S.ctx=toCtx(byId(H.drug),H.str);readMed();break}if(H.ocr){speak(ocrSpeak(H.ocr));break}S.ctx=D;readMed();break;
  case 'hdel':S.hist=S.hist.filter(x=>x.id!==id);save();$('#hl').innerHTML=histList($('#hs').value);toast('تم حذف السجل.');break;
  case 'radd':addRem();break;
  case 'rdel':S.rem=S.rem.filter(x=>x.id!==id);save();render();break;
  case 'rtake':R.taken=new Date().toDateString();save();render();toast('تم تسجيل أنك تناولت '+R.name,true);break;
  case 'taken':R.taken=new Date().toDateString();save();$('#al').classList.remove('on');speechSynthesis.cancel();toast('تم تسجيل تناول الدواء.');if(S.view==='rem')render();break;
  case 'snooze':{const d2=new Date(Date.now()+600000);R.time=String(d2.getHours()).padStart(2,'0')+':'+String(d2.getMinutes()).padStart(2,'0');save();$('#al').classList.remove('on');speechSynthesis.cancel();toast('تم التأجيل إلى '+R.time,true);break}
  case 'hear':speak('تعليمات '+R.name+': اتبع الجرعة المكتوبة في وصفتك. '+(R.dose||'لم تُسجَّل جرعة لهذا التذكير.'));break;
  case 'oread':speak(ocrSpeak(S.ocr));break;
  case 'pick':$('#fi').click();break;
  case 'cf':{S.cf=d.k;$('#cc').innerHTML=cmChips();$('#cl').innerHTML=cmList();const b=$('#cc [data-k="'+d.k+'"]');b&&b.focus();break}
  case 'cmread':{const c=COMMON[+d.i];speak(c.n+'. '+c.d+' لا يناسب أو انتبه إذا: '+c.w);break}
  case 'cread':{const c=COMMON[+d.i];speak(c[0].replace(/[^\u0600-\u06FF\s]/g,'')+'. '+c[1]+' '+c[2]);break}
  case 'wipe':if(confirm('حذف كل الأدوية والسجل والتذكيرات؟')){S.meds=[];S.hist=[];S.rem=[];S.ctx=null;save();render();toast('تم حذف بياناتك.',true)}break;
 }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){buzz();act(b.dataset.a,b.dataset)}});
let greeted=false;
document.addEventListener('pointerdown',()=>{if(!greeted){greeted=true;if(S.set.blind&&S.view==='home')speak('مرحبًا، أنا عيني. يمكنك أن تطلب مني تصوير دواء أو طرح سؤال أو الاستماع إلى أدويتك.')}},{once:true});
load();applySet();render();setInterval(tick,20000);
$('#sp .orbw').innerHTML=eye();setTimeout(()=>{const s=$('#sp');if(s){s.classList.add('off');setTimeout(()=>s.remove(),900)}},2400);
})();
</script>
</body>
</html>
